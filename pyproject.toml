[project]
name = "inflation-nowcasting"
version = "0.1.0"
description = "Point-in-time backtest for nowcasting US CPI (m/m), using only what was publicly known at each simulated date."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Davi Liberato" }]
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inflation_nowcasting"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--cov=inflation_nowcasting --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]

